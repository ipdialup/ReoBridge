name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Linux packages
        run: |
          v='${{ github.ref_name }}'
          mkdir -p dist
          for rid in linux-x64 linux-arm64; do
            dotnet publish src/ReoBridge -c Release -r $rid --self-contained -p:PublishSingleFile=true -p:Version=${v#v} -o pkg/$rid
            cp reobridge.example.json README.md LICENSE pkg/$rid/
            rm -f pkg/$rid/*.pdb
            chmod +x pkg/$rid/ReoBridge
            tar -czf dist/ReoBridge-$v-$rid.tar.gz -C pkg/$rid .
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  release:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test -c Release
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Build Windows package
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'
          $common = '-c', 'Release', '-r', 'win-x64', '--self-contained', '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true', "-p:Version=$($v.TrimStart('v'))"
          dotnet publish src/ReoBridge @common -o pkg/win/publish
          dotnet publish src/ReoBridge.Tray @common -o pkg/win/publish
          Copy-Item scripts -Destination pkg/win/scripts -Recurse
          Copy-Item reobridge.example.json, README.md, LICENSE pkg/win/
          Remove-Item pkg/win/publish/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive pkg/win/* "dist/ReoBridge-$v-win-x64.zip"
          Get-ChildItem dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem dist).FullName --title "ReoBridge ${{ github.ref_name }}" --notes-file .github/release-notes.md
