name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test -c Release
      - name: Publish Windows service and tray
        run: |
          dotnet publish src/ReoBridge -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/win-x64
          dotnet publish src/ReoBridge.Tray -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/win-x64
      - name: Publish Linux
        run: |
          dotnet publish src/ReoBridge -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o out/linux-x64
          dotnet publish src/ReoBridge -c Release -r linux-arm64 --self-contained -p:PublishSingleFile=true -o out/linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: reobridge
          path: out/
